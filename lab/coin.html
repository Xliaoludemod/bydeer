<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拾遗 · 金币小人 · 调参台</title>
<style>
:root{
  --bg:#faf8f4; --ink:#2c2c2a; --ink-soft:#6b675f; --line:#d8d5cc; --card:#efede6; --accent:#8a6d4a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink); overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  display:flex;
}
#stage{
  position:relative; flex:1; min-width:0;
  background:#c9c6bf;
  background-size:cover; background-position:center;
  transition:background-color .3s;
}
#stage.plain{background-image:none!important;background-color:var(--card)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#c:active{cursor:grabbing}
.hint{
  position:absolute;left:24px;bottom:20px;pointer-events:none;
  font-size:12px;letter-spacing:.12em;color:rgba(255,255,255,.92);
  text-shadow:0 1px 8px rgba(0,0,0,.5);
}
#stage.plain .hint{color:var(--ink-soft);text-shadow:none}
.badge{
  position:absolute;left:24px;top:22px;pointer-events:none;
  font-size:11.5px;letter-spacing:.22em;color:rgba(255,255,255,.9);
  text-shadow:0 1px 8px rgba(0,0,0,.5);
}
#stage.plain .badge{color:var(--ink-soft);text-shadow:none}

#panel{
  width:326px;flex:none;height:100%;overflow-y:auto;
  border-left:1px solid var(--line);padding:26px 24px 40px;
  background:var(--bg);
}
.ptitle{font-size:14px;font-weight:500;letter-spacing:.16em}
.psub{margin-top:7px;font-size:11.5px;line-height:1.75;color:var(--ink-soft)}
.sep{height:1px;background:var(--line);margin:20px 0}

.row{margin-bottom:19px}
.row>label{
  display:flex;justify-content:space-between;align-items:baseline;
  font-size:12px;letter-spacing:.07em;color:var(--ink-soft);margin-bottom:9px;
}
.row>label b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:2px;
  background:var(--line);border-radius:2px;outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--ink);cursor:pointer;border:none;
}
input[type=range]::-moz-range-thumb{
  width:14px;height:14px;border-radius:50%;background:var(--ink);cursor:pointer;border:none;
}

.sect{font-size:11.5px;letter-spacing:.14em;color:var(--ink-soft);margin-bottom:11px}
.sw{display:flex;gap:9px;flex-wrap:wrap}
.sw button{
  width:30px;height:30px;border-radius:50%;cursor:pointer;padding:0;
  border:1px solid rgba(0,0,0,.07);transition:transform .2s;
}
.sw button:hover{transform:scale(1.08)}
.sw button.on{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink)}

.presets{display:flex;gap:8px;margin-bottom:20px}
.presets button{
  flex:1;padding:9px 0;border:1px solid var(--line);background:#fff;border-radius:8px;
  font-size:11.5px;letter-spacing:.08em;color:var(--ink-soft);cursor:pointer;font-family:inherit;
  transition:background .2s,color .2s,border-color .2s;
}
.presets button:hover{background:var(--card)}
.presets button.on{background:var(--ink);border-color:var(--ink);color:#fff}

.tog{
  display:flex;align-items:center;justify-content:space-between;cursor:pointer;
  font-size:12.5px;letter-spacing:.07em;color:var(--ink-soft);margin-bottom:15px;
}
.tog input{display:none}
.tog i{width:36px;height:20px;border-radius:10px;background:var(--line);position:relative;transition:background .25s;flex:none}
.tog i:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .25s}
.tog input:checked + i{background:var(--accent)}
.tog input:checked + i:after{transform:translateX(16px)}

.readout{
  background:var(--card);border-radius:10px;padding:14px 16px;
  font-size:12.5px;line-height:2;color:var(--ink-soft);
}
.readout b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.btn{
  width:100%;padding:11px;margin-top:16px;border:1px solid var(--line);background:#fff;
  border-radius:10px;font-size:12px;letter-spacing:.12em;color:var(--ink);
  cursor:pointer;font-family:inherit;transition:background .2s;
}
.btn:hover{background:var(--card)}
.foot{margin-top:18px;font-size:11px;line-height:1.8;color:#a8a49b}

@media(max-width:820px){
  body{flex-direction:column}
  #stage{height:52%}
  #panel{width:100%;height:48%;border-left:none;border-top:1px solid var(--line);padding:20px 18px 34px}
  .hint{left:16px;bottom:14px}
  .badge{left:16px;top:16px}
}
</style>
</head>
<body>

<div id="stage">
  <canvas id="c"></canvas>
  <div class="badge">拾遗 · 金币小人</div>
  <div class="hint">拖动旋转 · 滚轮缩放</div>
</div>

<aside id="panel">
  <div class="ptitle">厚度调参台</div>
  <div class="psub">拖到顺眼为止。定稿后点底部按钮复制参数，我照这组数字做成正式彩蛋。</div>

  <div class="sep"></div>

  <div class="presets" id="presets">
    <button data-p="thin">薄片</button>
    <button data-p="std" class="on">标准</button>
    <button data-p="thick">厚饼</button>
  </div>

  <div class="row">
    <label>金币厚度 <b id="vThick">0.200</b></label>
    <input type="range" id="thick" min="0.05" max="0.62" step="0.005" value="0.20">
  </div>

  <div class="row">
    <label>边缘倒角 <b id="vBevel">0.045</b></label>
    <input type="range" id="bevel" min="0" max="0.13" step="0.005" value="0.045">
  </div>

  <div class="row">
    <label>小人大小 <b id="vSize">1.00</b></label>
    <input type="range" id="size" min="0.7" max="1.35" step="0.02" value="1.0">
  </div>

  <div class="row">
    <label>磨砂程度 <b id="vRough">0.92</b></label>
    <input type="range" id="rough" min="0.30" max="1" step="0.01" value="0.92">
  </div>

  <div class="sep"></div>

  <div class="sect">马卡龙主色</div>
  <div class="sw" id="sw"></div>

  <div class="sep"></div>

  <label class="tog"><span>小人手脚</span><input type="checkbox" id="limbs" checked><i></i></label>
  <label class="tog"><span>铺在照片上</span><input type="checkbox" id="photo" checked><i></i></label>
  <label class="tog"><span>缓慢自转</span><input type="checkbox" id="auto" checked><i></i></label>

  <div class="sep"></div>

  <div class="readout" id="readout"></div>

  <button class="btn" id="copy">复制这组参数</button>
  <div class="foot" id="rev">引擎加载中…</div>
</aside>

<script src="../lib/three.min.js"></script>
<script>
(function(){
"use strict";

if (typeof THREE === "undefined") {
  document.getElementById("rev").textContent = "three.js 未加载：请确认 ../lib/three.min.js 存在";
  return;
}

var stage   = document.getElementById("stage");
var canvas  = document.getElementById("c");
var revBox  = document.getElementById("rev");
revBox.textContent = "three.js r" + THREE.REVISION;

var MACARON = ["#A8D5C8","#F3C0CB","#F2DFA0","#C6B6E3","#A9C9E8","#F5C4A8"];
var FACE    = "#FBF6EC";
var EYE     = "#4A4440";
var BLUSH   = "#F2A8B0";

var cfg = {
  thick: 0.20, bevel: 0.045, size: 1.0, rough: 0.92,
  color: MACARON[0], limbs: true, photo: true, auto: true
};

/* 网址参数可锁定一组数值，例：?t=0.31&b=0.06&c=F3C0CB */
(function () {
  var q;
  try { q = new URLSearchParams(location.search); } catch (_) { return; }
  function num(k, min, max) {
    if (!q.has(k)) return null;
    var v = parseFloat(q.get(k));
    return isNaN(v) ? null : Math.max(min, Math.min(max, v));
  }
  var t = num("t", 0.05, 0.62); if (t !== null) cfg.thick = t;
  var b = num("b", 0, 0.13);    if (b !== null) cfg.bevel = b;
  var s = num("s", 0.7, 1.35);  if (s !== null) cfg.size  = s;
  var r = num("r", 0.30, 1);    if (r !== null) cfg.rough = r;
  if (q.has("c")) {
    var c = "#" + q.get("c").replace("#", "");
    if (/^#[0-9a-fA-F]{6}$/.test(c)) cfg.color = c.toUpperCase();
  }
  if (q.has("limbs")) cfg.limbs = q.get("limbs") !== "0";
  if (q.has("photo")) cfg.photo = q.get("photo") !== "0";
  if (q.has("auto"))  cfg.auto  = q.get("auto")  !== "0";
})();

/* ---------- 渲染器 ---------- */
var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearAlpha(0);
if ("outputColorSpace" in renderer && THREE.SRGBColorSpace) {
  renderer.outputColorSpace = THREE.SRGBColorSpace;
} else if (THREE.sRGBEncoding !== undefined) {
  renderer.outputEncoding = THREE.sRGBEncoding;
}

var scene  = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
var zoom   = 1;
function applyCam() { camera.position.z = 6.0 * zoom; }
applyCam();

scene.add(new THREE.HemisphereLight(0xffffff, 0xdcd5c8, 1.15));
var key = new THREE.DirectionalLight(0xffffff, 1.5);  key.position.set(3, 4, 6);   scene.add(key);
var fil = new THREE.DirectionalLight(0xf0e6d8, 0.62); fil.position.set(-5, -2, 4); scene.add(fil);
var rim = new THREE.DirectionalLight(0xffffff, 0.7);  rim.position.set(-1, 1.6, -6); scene.add(rim);

/* ---------- 金币 ---------- */
var coin = new THREE.Group();
coin.rotation.set(0.14, -0.62, 0);
scene.add(coin);

var meshes = [];

function clearCoin() {
  meshes.forEach(function (m) {
    if (m.geometry) m.geometry.dispose();
    if (m.material) {
      if (Array.isArray(m.material)) m.material.forEach(function (x) { x.dispose(); });
      else m.material.dispose();
    }
    coin.remove(m);
  });
  meshes = [];
}

function circlePlate(radius, depth, bevel, segs) {
  var s = new THREE.Shape();
  s.absarc(0, 0, radius, 0, Math.PI * 2, false);
  var g = new THREE.ExtrudeGeometry(s, {
    depth: depth, curveSegments: segs || 72, steps: 1,
    bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 8
  });
  g.center();
  return g;
}

function mat(color, rough) {
  return new THREE.MeshStandardMaterial({
    color: new THREE.Color(color),
    roughness: rough, metalness: 0.04
  });
}

function build() {
  clearCoin();

  var R = 1;
  var T = cfg.thick, B = cfg.bevel;
  var bodyMat = mat(cfg.color, cfg.rough);
  var faceMat = mat(FACE, Math.min(1, cfg.rough + 0.04));
  var eyeMat  = mat(EYE, 0.55);
  var blushMat = new THREE.MeshStandardMaterial({
    color: new THREE.Color(BLUSH), roughness: 0.9, metalness: 0,
    transparent: true, opacity: 0.55
  });

  /* 币身：圆柱 + 倒角 */
  var body = new THREE.Mesh(circlePlate(R, T, B), bodyMat);
  coin.add(body); meshes.push(body);

  var capZ = T / 2 + B;           // 正面平面所在的 z

  /* 奶白脸：微微凸起的一层 */
  var pD = 0.05, pB = 0.014, pR = 0.70;
  var plate = new THREE.Mesh(circlePlate(pR, pD, pB), faceMat);
  plate.position.z = capZ - 0.02 + pD / 2 + pB;
  coin.add(plate); meshes.push(plate);
  var frontZ = plate.position.z + pD / 2 + pB;

  /* 眼睛 */
  [-0.24, 0.24].forEach(function (x) {
    var e = new THREE.Mesh(new THREE.SphereGeometry(0.082, 22, 16), eyeMat);
    e.position.set(x, 0.15, frontZ - 0.012);
    e.scale.set(1, 1.18, 0.55);
    coin.add(e); meshes.push(e);
  });

  /* 嘴：半环，翻转成正着的微笑 */
  var mouth = new THREE.Mesh(new THREE.TorusGeometry(0.088, 0.019, 10, 26, Math.PI), eyeMat);
  mouth.rotation.z = Math.PI;
  mouth.position.set(0, -0.075, frontZ - 0.006);
  coin.add(mouth); meshes.push(mouth);

  /* 腮红 */
  [-0.405, 0.405].forEach(function (x) {
    var b = new THREE.Mesh(new THREE.CircleGeometry(0.072, 26), blushMat);
    b.position.set(x, -0.045, frontZ + 0.002);
    coin.add(b); meshes.push(b);
  });

  /* 小人手脚 */
  if (cfg.limbs) {
    [-1, 1].forEach(function (s) {
      var arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.078, 0.28, 6, 16), bodyMat);
      arm.position.set(s * 1.01, 0.10, 0);
      arm.rotation.z = -s * 0.38;
      coin.add(arm); meshes.push(arm);

      var foot = new THREE.Mesh(new THREE.CapsuleGeometry(0.092, 0.15, 6, 16), bodyMat);
      foot.position.set(s * 0.40, -1.02, 0);
      foot.rotation.z = s * 0.26;
      coin.add(foot); meshes.push(foot);
    });
  }

  coin.scale.setScalar(cfg.size);

  /* 读数 */
  var ratio = (T + 2 * B) / (2 * R) * 100;
  document.getElementById("readout").innerHTML =
    "厚度 <b>" + T.toFixed(3) + "</b> · 倒角 <b>" + B.toFixed(3) + "</b><br>" +
    "整体厚度约为直径的 <b>" + ratio.toFixed(1) + "%</b><br>" +
    "按直径 40mm 折算 ≈ <b>" + (40 * (T + 2 * B) / (2 * R)).toFixed(1) + " mm</b>";
}

/* ---------- 视图尺寸 ---------- */
function resize() {
  var w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);

/* ---------- 拖拽 / 缩放 ---------- */
var dragging = false, lx = 0, ly = 0;
canvas.addEventListener("pointerdown", function (e) {
  dragging = true; lx = e.clientX; ly = e.clientY;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", function (e) {
  if (!dragging) return;
  coin.rotation.y += (e.clientX - lx) * 0.008;
  coin.rotation.x += (e.clientY - ly) * 0.008;
  coin.rotation.x = Math.max(-1.1, Math.min(1.1, coin.rotation.x));
  lx = e.clientX; ly = e.clientY;
});
function endDrag(e) { dragging = false; if (e && e.pointerId !== undefined) { try { canvas.releasePointerCapture(e.pointerId); } catch (_) {} } }
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);
canvas.addEventListener("wheel", function (e) {
  e.preventDefault();
  zoom = Math.max(0.58, Math.min(1.9, zoom * (1 + e.deltaY * 0.0011)));
  applyCam();
}, { passive: false });

/* ---------- 控件 ---------- */
function bindRange(id, key, digits, out) {
  var el = document.getElementById(id), lab = document.getElementById(out);
  el.addEventListener("input", function () {
    cfg[key] = parseFloat(el.value);
    lab.textContent = digits ? cfg[key].toFixed(digits) : cfg[key];
    build();
    clearPreset();
  });
}
bindRange("thick", "thick", 3, "vThick");
bindRange("bevel", "bevel", 3, "vBevel");
bindRange("size",  "size",  2, "vSize");
bindRange("rough", "rough", 2, "vRough");

var swWrap = document.getElementById("sw");
MACARON.forEach(function (c, i) {
  var b = document.createElement("button");
  b.style.background = c;
  if (i === 0) b.className = "on";
  b.addEventListener("click", function () {
    cfg.color = c;
    Array.prototype.forEach.call(swWrap.children, function (x) { x.className = ""; });
    b.className = "on";
    build();
  });
  swWrap.appendChild(b);
});

function bindTog(id, key, after) {
  var el = document.getElementById(id);
  el.addEventListener("change", function () {
    cfg[key] = el.checked;
    if (after) after();
    else build();
  });
}
bindTog("limbs", "limbs");
bindTog("auto", "auto");
bindTog("photo", "photo", function () {
  stage.classList.toggle("plain", !cfg.photo);
});

var presetBox = document.getElementById("presets");
function clearPreset() {
  Array.prototype.forEach.call(presetBox.children, function (x) { x.className = ""; });
}
var PRESETS = {
  thin:  { thick: 0.09, bevel: 0.03 },
  std:   { thick: 0.20, bevel: 0.045 },
  thick: { thick: 0.37, bevel: 0.075 }
};
presetBox.addEventListener("click", function (e) {
  var btn = e.target.closest("button[data-p]");
  if (!btn) return;
  var p = PRESETS[btn.dataset.p];
  cfg.thick = p.thick; cfg.bevel = p.bevel;

  var t = document.getElementById("thick"), b = document.getElementById("bevel");
  t.value = p.thick; b.value = p.bevel;
  document.getElementById("vThick").textContent = p.thick.toFixed(3);
  document.getElementById("vBevel").textContent = p.bevel.toFixed(3);

  clearPreset();
  btn.className = "on";
  build();
});

document.getElementById("copy").addEventListener("click", function () {
  var btn = this, old = btn.textContent;
  var txt = "厚度=" + cfg.thick.toFixed(3) + " 倒角=" + cfg.bevel.toFixed(3) +
            " 大小=" + cfg.size.toFixed(2) + " 磨砂=" + cfg.rough.toFixed(2) +
            " 主色=" + cfg.color + " 手脚=" + (cfg.limbs ? "有" : "无");
  function done() { btn.textContent = "已复制"; setTimeout(function () { btn.textContent = old; }, 1400); }
  if (navigator.clipboard) navigator.clipboard.writeText(txt).then(done, done);
  else { window.prompt("手动复制：", txt); }
});

/* ---------- 背景照片 ---------- */
try {
  stage.style.backgroundImage = 'url("' + encodeURI("../photos/银盐·胶片/海边的人/01.jpg") + '")';
} catch (_) {}

/* ---------- 用 cfg 反向同步界面（供网址参数使用） ---------- */
function syncUI() {
  document.getElementById("thick").value = cfg.thick;
  document.getElementById("vThick").textContent = cfg.thick.toFixed(3);
  document.getElementById("bevel").value = cfg.bevel;
  document.getElementById("vBevel").textContent = cfg.bevel.toFixed(3);
  document.getElementById("size").value = cfg.size;
  document.getElementById("vSize").textContent = cfg.size.toFixed(2);
  document.getElementById("rough").value = cfg.rough;
  document.getElementById("vRough").textContent = cfg.rough.toFixed(2);

  Array.prototype.forEach.call(swWrap.children, function (x, i) {
    x.className = (MACARON[i].toLowerCase() === String(cfg.color).toLowerCase()) ? "on" : "";
  });

  document.getElementById("limbs").checked = cfg.limbs;
  document.getElementById("photo").checked = cfg.photo;
  document.getElementById("auto").checked  = cfg.auto;
  stage.classList.toggle("plain", !cfg.photo);

  clearPreset();
  Object.keys(PRESETS).forEach(function (k) {
    if (Math.abs(PRESETS[k].thick - cfg.thick) < 0.001 &&
        Math.abs(PRESETS[k].bevel - cfg.bevel) < 0.001) {
      presetBox.querySelector('[data-p="' + k + '"]').className = "on";
    }
  });
}

/* ---------- 循环 ---------- */
var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
if (reduce) { cfg.auto = false; }

function tick() {
  if (cfg.auto && !dragging) coin.rotation.y += 0.0042;
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

syncUI();
resize();
build();
tick();
})();
</script>
</body>
</html>
